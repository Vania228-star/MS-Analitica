spring.application.name=msanalitica

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Productor: lo usa el DeadLetterPublishingRecoverer para publicar en el DLT
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumidor: lee texto y el JSON lo parsea el listener (mismo criterio que
# ms-asientos y ms-notificaciones: un tópico, muchos lectores)
spring.kafka.consumer.group-id=ms-analitica
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ACK manual: el offset se confirma recién cuando la ventana se cierra y el
# resumen ya está subido a S3
spring.kafka.listener.ack-mode=manual_immediate
# La ventana dura 5 minutos y Kafka expulsa al consumidor si no hace poll en 5:
# 15 minutos de margen para que los ACK diferidos sigan siendo válidos
spring.kafka.consumer.properties.max.poll.interval.ms=900000

# ---------- Ventana de agregación (5 min) ----------
analitica.ventana-ms=${ANALITICA_VENTANA_MS:300000}

# ---------- S3 (sin claves: el rol de la EC2) ----------
aws.region=${AWS_REGION:us-east-1}
s3.bucket-name=${S3_BUCKET_NAME:}
# false = local sin credenciales: solo imprime el resumen en el log
s3.habilitado=${S3_HABILITADO:true}